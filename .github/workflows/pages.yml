name: Deploy demo to GitHub Pages

# The live demo is currently served from the gh-pages branch (Pages source: branch).
# Run this manually after switching the Pages source to GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo-dapp/package-lock.json
      # review.html imports the shared decoder/rules/UI from the repository root.
      # Their module resolution requires the root runtime dependencies too.
      - run: npm ci
      - run: npm --prefix demo-dapp ci
      - run: node scripts/collect-license-notices.js site
      - run: npm --prefix demo-dapp run build
        env:
          VITE_DEMO_CHAIN: "11155111"
          VITE_SEPOLIA_RPC: https://ethereum-sepolia-rpc.publicnode.com
      - name: Publish community denylist
        run: cp docs/denylist.json demo-dapp/dist/denylist.json
      - name: Build and publish the Chrome extension (unpacked zip)
        run: |
          npm run build
          (cd .output/chrome-mv3 && zip -qr ../../demo-dapp/dist/plainsign-extension.zip .)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dapp/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
